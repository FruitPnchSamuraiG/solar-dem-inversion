<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>compare — demdemo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300&display=swap" rel="stylesheet" />
    <style>
      .results-section { max-width: 1050px; margin: 0 auto 2.5rem; }
      .results-section table { width: 100%; border-collapse: collapse; font-size: 1rem; font-variant-numeric: tabular-nums; }
      .results-section table { border-top: 2px solid #555; border-bottom: 2px solid #555; background: white; }
      .results-section th { background: white; color: #111; font-weight: 700; border-bottom: 1px solid #777; }
      .results-section th, .results-section td { padding: 14px 18px; text-align: right; }
      .results-section th:first-child, .results-section td:first-child { text-align: left; }
      .results-section td { border: 0; background: white; }
      .results-section tbody tr:nth-child(2n+3) td { border-top: 1px solid #ddd; }
      .linked-panel { overflow: hidden; min-width: 220px; cursor: grab; touch-action: none; }
      .linked-panel:active { cursor: grabbing; }
      .linked-panel img { display: block; transform-origin: 0 0; user-select: none; -webkit-user-drag: none; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      }
      .serif {
        font-family: 'Source Serif 4', serif;
      }
      #zoom-modal[hidden] {
        display: none;
      }
      #zoom-canvas {
        cursor: grab;
        touch-action: none;
      }
      #zoom-canvas.dragging {
        cursor: grabbing;
      }
      #zoom-image {
        max-width: none;
        max-height: none;
        user-select: none;
        -webkit-user-drag: none;
        transform-origin: 0 0;
      }
    </style>
  </head>
  <body class="bg-white text-black flex flex-col min-h-screen">

    <!-- main compare section -->
    <main class="flex-grow w-full max-w-screen-2xl mx-auto px-4 sm:px-8 pt-12">
      <h1 class="serif text-4xl font-light mb-2 text-center">DEM comparison</h1>
      <p class="text-center text-gray-600 mb-8">Compare DEM estimates and their agreement with observed AIA</p>

      <div class="flex flex-wrap justify-center gap-6 mb-10">
        <div class="text-center">
          <label for="select1" class="block mb-2 font-light serif text-xl">Reference solver</label>
          <select id="select1" class="border px-4 py-2 text-base rounded serif"></select>
        </div>
        <div class="text-center">
          <label for="date" class="block mb-2 font-light serif text-xl">Date</label>
          <select id="date" class="border px-4 py-2 text-base rounded serif"></select>
        </div>
        <div class="text-center">
          <label for="viewMode" class="block mb-2 font-light serif text-xl">View</label>
          <select id="viewMode" class="border px-4 py-2 text-base rounded serif">
        <option value="dems">DEMs</option>
        <option value="aia">Observed &amp; reconstructed AIA</option>
        <option value="jpdfs">JPDFs: reconstruction vs observed</option>
        <option value="results">Results</option>
          </select>
        </div>
      </div>

      <p id="view-description" class="max-w-3xl mx-auto text-center text-gray-600 mb-4 leading-relaxed" aria-live="polite"></p>
      <div class="text-center text-sm text-gray-600 mb-4">
        Shift + scroll over an image to zoom all panels · drag to pan all · double-click to reset
        <button id="reset-linked-zoom" type="button" class="border rounded px-3 py-1 ml-2">Reset all images</button>
      </div>
      <div class="overflow-x-auto">
        <table id="comparison-table" class="w-full border-separate border-spacing-y-8"></table>
        <div id="results-content" hidden></div>
      </div>
    </main>

    <div id="zoom-modal" hidden class="fixed inset-0 z-50 bg-black/85 p-4 sm:p-8" role="dialog" aria-modal="true" aria-labelledby="zoom-title">
      <div class="mx-auto flex h-full max-w-7xl flex-col rounded bg-white p-3 shadow-2xl">
        <div class="mb-2 flex items-center justify-between gap-4">
          <div>
            <h2 id="zoom-title" class="serif text-xl"></h2>
            <p class="text-xs text-gray-500">Scroll to zoom · drag to pan · double-click to reset</p>
          </div>
          <button id="zoom-close" type="button" class="rounded border px-3 py-1 text-sm hover:bg-gray-100" aria-label="Close zoom view">Close</button>
        </div>
        <div id="zoom-canvas" class="relative min-h-0 flex-1 overflow-hidden rounded border bg-black">
          <img id="zoom-image" alt="" draggable="false" class="absolute left-0 top-0" />
        </div>
      </div>
    </div>

    <script src="compare.js?v=20260919-tables"></script>
  </body>
</html>
