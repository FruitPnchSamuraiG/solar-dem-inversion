<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>compare — demdemo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      }
      .serif {
        font-family: 'Source Serif 4', serif;
      }
      #zoom-modal[hidden] {
        display: none;
      }
      #zoom-canvas {
        cursor: grab;
        touch-action: none;
      }
      #zoom-canvas.dragging {
        cursor: grabbing;
      }
      #zoom-image {
        max-width: none;
        max-height: none;
        user-select: none;
        -webkit-user-drag: none;
        transform-origin: 0 0;
      }
    </style>
  </head>
  <body class="bg-white text-black flex flex-col min-h-screen">

    <!-- main compare section -->
    <main class="flex-grow px-4 sm:px-16 md:px-32 lg:px-64 pt-12">
      <h1 class="serif text-4xl font-light mb-2 text-center">DEM comparison</h1>
      <p class="text-center text-gray-600 mb-8">Reference solver versus unsupervised mlp6 (176k parameters)</p>

      <div class="flex flex-wrap justify-center gap-6 mb-10">
        <div class="text-center">
          <label for="select1" class="block mb-2 font-light serif text-xl">Reference solver</label>
          <select id="select1" class="border px-4 py-2 text-base rounded serif"></select>
        </div>
        <div class="text-center">
          <label for="select2" class="block mb-2 font-light serif text-xl">Unsupervised model</label>
          <select id="select2" class="border px-4 py-2 text-base rounded serif"></select>
        </div>
        <div class="text-center">
          <label for="date" class="block mb-2 font-light serif text-xl">Date</label>
          <select id="date" class="border px-4 py-2 text-base rounded serif"></select>
        </div>
        <div class="text-center">
          <label for="viewMode" class="block mb-2 font-light serif text-xl">View</label>
          <select id="viewMode" class="border px-4 py-2 text-base rounded serif">
        <option value="dems">dems</option>
        <option value="aia">resynth</option>
        <option value="jpdfs">joint pdfs</option>
          </select>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table id="comparison-table" class="w-full border-separate border-spacing-y-8"></table>
      </div>
    </main>

    <div id="zoom-modal" hidden class="fixed inset-0 z-50 bg-black/85 p-4 sm:p-8" role="dialog" aria-modal="true" aria-labelledby="zoom-title">
      <div class="mx-auto flex h-full max-w-7xl flex-col rounded bg-white p-3 shadow-2xl">
        <div class="mb-2 flex items-center justify-between gap-4">
          <div>
            <h2 id="zoom-title" class="serif text-xl"></h2>
            <p class="text-xs text-gray-500">Scroll to zoom · drag to pan · double-click to reset</p>
          </div>
          <button id="zoom-close" type="button" class="rounded border px-3 py-1 text-sm hover:bg-gray-100" aria-label="Close zoom view">Close</button>
        </div>
        <div id="zoom-canvas" class="relative min-h-0 flex-1 overflow-hidden rounded border bg-black">
          <img id="zoom-image" alt="" draggable="false" class="absolute left-0 top-0" />
        </div>
      </div>
    </div>

    <script src="compare.js"></script>
  </body>
</html>
