<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>compare — demdemo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      }
      .serif {
        font-family: 'Source Serif 4', serif;
      }
    </style>
  </head>
  <body class="bg-white text-black flex flex-col min-h-screen">

    <!-- header -->
    <header class="px-4 sm:px-16 md:px-32 lg:px-64 pt-8 sm:pt-12 md:pt-16 pb-8 sm:pb-12 md:pb-16">
      <nav class="mt-6 text-center text-base flex flex-col sm:flex-row sm:justify-between items-center">
        <div class="flex items-center space-x-4">
          <img src="assets/logo.png" alt="Logo" class="h-16 w-16" />
          <a href="index.html" class="italic mb-4 sm:mb-0">demdemo</a>
        </div>
        <div class="space-x-4 sm:space-x-8">
          <a href="dashboard.html" class="hover:underline">dashboard</a>
          <a href="compare.html" class="hover:underline">compare</a>
        </div>
      </nav>
    </header>

    <!-- main compare section -->
    <main class="flex-grow px-4 sm:px-16 md:px-32 lg:px-64">
      <h2 class="serif text-4xl font-light mb-8 text-center">Compare Models</h2>

      <div class="flex flex-wrap justify-center gap-6 mb-10">
        <div class="text-center">
          <label for="select1" class="block mb-2 font-light serif text-xl">Model 1</label>
          <select id="select1" class="border px-4 py-2 text-base rounded serif"></select>
        </div>
        <div class="text-center">
          <label for="select2" class="block mb-2 font-light serif text-xl">Model 2</label>
          <select id="select2" class="border px-4 py-2 text-base rounded serif"></select>
        </div>
        <div class="text-center">
          <label for="viewMode" class="block mb-2 font-light serif text-xl">View</label>
          <select id="viewMode" class="border px-4 py-2 text-base rounded serif">
        <option value="metrics">metrics</option>
        <option value="dems">dems</option>
        <option value="aia">resynth</option>
        <option value="jpdfs">joint pdfs</option>
          </select>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table id="comparison-table" class="w-full border-separate border-spacing-y-8"></table>
      </div>
    </main>

    <!-- footer -->
    <footer class="text-center py-12 text-sm text-gray-600 leading-relaxed">
      <div class="italic">demdemo</div>
      <div>New York University</div>
    </footer>

    <script src="compare.js"></script>
  </body>
</html>
